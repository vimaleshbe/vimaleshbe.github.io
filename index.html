<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=9">
    <noscript><style>.loader{display:none!important}body.is-loading .sections,body.is-loading .section-nav,body.is-loading .float-theme{opacity:1!important}</style></noscript>
</head>
<body class="is-loading">

    <!-- Ambient background -->
    <div class="bg" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <div class="agents-layer" id="agents-layer">
            <div class="agents-pan">
                <canvas class="agents" id="agents-net" aria-hidden="true"></canvas>
            </div>
        </div>
        <span class="grain"></span>
    </div>
    <div class="veil" aria-hidden="true"></div>

    <!-- Loader -->
    <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="loader-inner">
            <span class="loader-name" data-text="personal.name"></span>
            <span class="loader-track"><span class="loader-fill"></span></span>
            <span class="loader-label">Loading</span>
        </div>
    </div>

    <!-- Theme toggle -->
    <button class="icon-btn theme-toggle float-theme" id="theme-toggle" aria-label="Toggle theme"></button>

    <!-- Top navigation (appears from the 2nd section onward) -->
    <header class="topnav" id="topnav">
        <div class="topnav-inner">
            <button class="topnav-brand" id="topnav-brand" type="button" data-text="personal.name"></button>
            <nav class="topnav-links" id="topnav-links" aria-label="Sections"></nav>
        </div>
    </header>

    <!-- ================= Sections ================= -->
    <main class="sections" id="sections">

        <!-- Home -->
        <section class="pane" id="home" aria-label="Intro">
            <div class="wrap">
                <div class="hero-grid">
                    <h1 id="hero-name" data-text="personal.name"></h1>
                    <span class="hero-role" id="hero-role" data-text="personal.title"></span>
                    <p class="hero-intro" id="hero-intro" data-text="personal.bio" data-sentences="2"></p>
                    <div class="hero-actions">
                        <button class="btn btn-primary" id="cta-contact" type="button">Get in touch</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Awards -->
        <section class="pane" id="awards" aria-label="Awards">
            <div class="wrap">
                <div class="exp-head">
                    <h2 class="pane-title" data-text="sections.awards.heading"></h2>
                </div>
                <div class="awards-grid" id="awards-grid"></div>
            </div>
        </section>

        <!-- Skills -->
        <section class="pane" id="skills" aria-label="Skills">
            <div class="wrap">
                <div class="exp-head">
                    <h2 class="pane-title" data-text="sections.skills.heading"></h2>
                </div>
                <div class="skills-grid" id="skills-grid"></div>
            </div>
        </section>

        <!-- Experience -->
        <section class="pane" id="experience" aria-label="Experience">
            <div class="wrap">
                <div class="exp-head">
                    <h2 class="pane-title" data-text="sections.experience.heading"></h2>
                </div>
                <div class="exp-list" id="exp-list"></div>
            </div>
        </section>

        <!-- Certifications -->
        <section class="pane" id="certifications" aria-label="Certifications">
            <div class="wrap">
                <div class="exp-head">
                    <h2 class="pane-title" data-text="sections.certifications.heading"></h2>
                </div>
                <div class="certs-grid" id="certs-grid"></div>
            </div>
        </section>

        <!-- Contact -->
        <section class="pane" id="contact" aria-label="Contact">
            <div class="wrap">
                <div class="contact-block">
                    <h2 class="pane-title" data-text="sections.contact.heading"></h2>
                    <p class="pane-sub" data-text="sections.contact.subtitle"></p>
                    <div class="contact-actions" id="contact-actions"></div>
                </div>
            </div>
            <footer class="site-foot" data-text="meta.footer"></footer>
        </section>
    </main>

    <!-- Section navigation -->
    <div class="section-nav">
        <button class="icon-btn" id="nav-up" aria-label="Previous section" title="Previous">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
        <button class="icon-btn" id="nav-down" aria-label="Next section" title="Next">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
    </div>

    <script src="assets/js/script.js?v=9"></script>
</body>
</html>
