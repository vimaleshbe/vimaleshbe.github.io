<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cropper - Profile Setup</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .cropper-container {
            max-width: 800px;
            margin: 100px auto 50px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .cropper-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .cropper-header h1 {
            color: var(--primary-color, #2563eb);
            margin-bottom: 0.5rem;
        }
        
        .cropper-header p {
            color: var(--text-light, #6b7280);
        }
        
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: border-color 0.3s ease;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: var(--primary-color, #2563eb);
        }
        
        .upload-area.dragover {
            border-color: var(--primary-color, #2563eb);
            background-color: #f0f9ff;
        }
        
        .upload-icon {
            font-size: 3rem;
            color: #9ca3af;
            margin-bottom: 1rem;
        }
        
        .upload-text {
            color: var(--text-color, #1f2937);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .upload-hint {
            color: var(--text-light, #6b7280);
            font-size: 0.9rem;
        }
        
        #file-input {
            display: none;
        }
        
        .image-preview-container {
            display: none;
            margin-bottom: 2rem;
        }
        
        .canvas-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        
        #preview-canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        
        .crop-overlay {
            position: absolute;
            border: 2px solid var(--primary-color, #2563eb);
            background-color: rgba(37, 99, 235, 0.2);
            cursor: move;
        }
        
        .crop-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--primary-color, #2563eb);
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .crop-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
        .crop-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .crop-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
        
        .crop-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .aspect-ratio-controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .aspect-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .aspect-btn.active,
        .aspect-btn:hover {
            background-color: var(--primary-color, #2563eb);
            color: white;
            border-color: var(--primary-color, #2563eb);
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary {
            background-color: var(--primary-color, #2563eb);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--secondary-color, #1e40af);
        }
        
        .btn-secondary {
            background-color: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #4b5563;
        }
        
        .btn-success {
            background-color: #059669;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #047857;
        }
        
        .result-container {
            display: none;
            text-align: center;
            margin-top: 2rem;
            padding: 2rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background-color: #f9fafb;
        }
        
        .result-preview {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color, #2563eb);
            margin-bottom: 1rem;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color, #2563eb);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--secondary-color, #1e40af);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Profile
        </a>
        
        <div class="cropper-container">
            <div class="cropper-header">
                <h1><i class="fas fa-crop"></i> Image Cropper</h1>
                <p>Upload and crop your profile image to the perfect size</p>
            </div>
            
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-text">Click to upload an image</div>
                <div class="upload-hint">or drag and drop your image here</div>
                <input type="file" id="file-input" accept="image/*">
            </div>
            
            <div class="image-preview-container" id="preview-container">
                <div class="aspect-ratio-controls">
                    <button class="aspect-btn active" data-ratio="1">Square (1:1)</button>
                    <button class="aspect-btn" data-ratio="0.75">Portrait (3:4)</button>
                    <button class="aspect-btn" data-ratio="1.33">Landscape (4:3)</button>
                    <button class="aspect-btn" data-ratio="free">Free</button>
                </div>
                
                <div class="canvas-container">
                    <canvas id="preview-canvas"></canvas>
                    <div class="crop-overlay" id="crop-overlay">
                        <div class="crop-handle nw"></div>
                        <div class="crop-handle ne"></div>
                        <div class="crop-handle sw"></div>
                        <div class="crop-handle se"></div>
                    </div>
                </div>
                
                <div class="crop-controls">
                    <button class="btn btn-secondary" onclick="resetCrop()">Reset</button>
                    <button class="btn btn-primary" onclick="cropImage()">Crop Image</button>
                </div>
            </div>
            
            <div class="result-container" id="result-container">
                <h3>Cropped Result</h3>
                <img class="result-preview" id="result-preview" src="" alt="Cropped image">
                <div>
                    <button class="btn btn-success" onclick="downloadImage()">
                        <i class="fas fa-download"></i> Download
                    </button>
                    <button class="btn btn-secondary" onclick="startOver()">Crop Another</button>
                </div>
                <div style="margin-top: 1rem; font-size: 0.9rem; color: #6b7280;">
                    Save this image as "profile.jpg" in your img folder
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentImage = null;
        let cropData = { x: 0, y: 0, width: 200, height: 200 };
        let aspectRatio = 1;
        let isDragging = false;
        let isResizing = false;
        let startX = 0;
        let startY = 0;
        let currentHandle = null;

        const fileInput = document.getElementById('file-input');
        const uploadArea = document.querySelector('.upload-area');
        const previewContainer = document.getElementById('preview-container');
        const previewCanvas = document.getElementById('preview-canvas');
        const cropOverlay = document.getElementById('crop-overlay');
        const resultContainer = document.getElementById('result-container');
        const resultPreview = document.getElementById('result-preview');
        const ctx = previewCanvas.getContext('2d');

        // File upload handlers
        fileInput.addEventListener('change', handleFileSelect);
        uploadArea.addEventListener('dragover', handleDragOver);
        uploadArea.addEventListener('drop', handleDrop);

        // Aspect ratio controls
        document.querySelectorAll('.aspect-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.aspect-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const ratio = this.dataset.ratio;
                aspectRatio = ratio === 'free' ? null : parseFloat(ratio);
                resetCrop();
            });
        });

        // Crop overlay event listeners
        cropOverlay.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', stopDrag);

        // Handle resize handles
        document.querySelectorAll('.crop-handle').forEach(handle => {
            handle.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                isResizing = true;
                currentHandle = this.classList[1];
                startX = e.clientX;
                startY = e.clientY;
            });
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                loadImage(files[0]);
            }
        }

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage = new Image();
                currentImage.onload = function() {
                    displayImage();
                    previewContainer.style.display = 'block';
                    resultContainer.style.display = 'none';
                };
                currentImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function displayImage() {
            const maxWidth = 600;
            const maxHeight = 400;
            
            let { width, height } = currentImage;
            
            if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
            }
            
            if (height > maxHeight) {
                width = (width * maxHeight) / height;
                height = maxHeight;
            }
            
            previewCanvas.width = width;
            previewCanvas.height = height;
            
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(currentImage, 0, 0, width, height);
            
            resetCrop();
        }

        function resetCrop() {
            const canvas = previewCanvas;
            const size = Math.min(canvas.width, canvas.height) * 0.6;
            
            cropData = {
                x: (canvas.width - size) / 2,
                y: (canvas.height - size) / 2,
                width: size,
                height: aspectRatio ? size / aspectRatio : size
            };
            
            updateCropOverlay();
        }

        function updateCropOverlay() {
            const rect = previewCanvas.getBoundingClientRect();
            const scaleX = rect.width / previewCanvas.width;
            const scaleY = rect.height / previewCanvas.height;
            
            cropOverlay.style.left = `${cropData.x * scaleX}px`;
            cropOverlay.style.top = `${cropData.y * scaleY}px`;
            cropOverlay.style.width = `${cropData.width * scaleX}px`;
            cropOverlay.style.height = `${cropData.height * scaleY}px`;
        }

        function startDrag(e) {
            if (e.target === cropOverlay) {
                isDragging = true;
                const rect = previewCanvas.getBoundingClientRect();
                const scaleX = previewCanvas.width / rect.width;
                const scaleY = previewCanvas.height / rect.height;
                
                startX = (e.clientX - rect.left) * scaleX - cropData.x;
                startY = (e.clientY - rect.top) * scaleY - cropData.y;
            }
        }

        function handleMouseMove(e) {
            if (isDragging) {
                const rect = previewCanvas.getBoundingClientRect();
                const scaleX = previewCanvas.width / rect.width;
                const scaleY = previewCanvas.height / rect.height;
                
                const newX = (e.clientX - rect.left) * scaleX - startX;
                const newY = (e.clientY - rect.top) * scaleY - startY;
                
                cropData.x = Math.max(0, Math.min(newX, previewCanvas.width - cropData.width));
                cropData.y = Math.max(0, Math.min(newY, previewCanvas.height - cropData.height));
                
                updateCropOverlay();
            } else if (isResizing && currentHandle) {
                const rect = previewCanvas.getBoundingClientRect();
                const scaleX = previewCanvas.width / rect.width;
                const scaleY = previewCanvas.height / rect.height;
                
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;
                
                resizeCropArea(mouseX, mouseY);
                updateCropOverlay();
            }
        }

        function resizeCropArea(mouseX, mouseY) {
            const originalData = { ...cropData };
            
            switch (currentHandle) {
                case 'se':
                    cropData.width = Math.max(50, mouseX - cropData.x);
                    cropData.height = aspectRatio ? cropData.width / aspectRatio : Math.max(50, mouseY - cropData.y);
                    break;
                case 'sw':
                    const newWidth = cropData.x + cropData.width - mouseX;
                    if (newWidth > 50) {
                        cropData.x = mouseX;
                        cropData.width = newWidth;
                    }
                    cropData.height = aspectRatio ? cropData.width / aspectRatio : Math.max(50, mouseY - cropData.y);
                    break;
                case 'ne':
                    cropData.width = Math.max(50, mouseX - cropData.x);
                    const newHeight = cropData.y + cropData.height - mouseY;
                    if (newHeight > 50) {
                        cropData.y = mouseY;
                        cropData.height = aspectRatio ? cropData.width / aspectRatio : newHeight;
                    }
                    break;
                case 'nw':
                    const nwNewWidth = cropData.x + cropData.width - mouseX;
                    const nwNewHeight = cropData.y + cropData.height - mouseY;
                    if (nwNewWidth > 50 && nwNewHeight > 50) {
                        cropData.x = mouseX;
                        cropData.y = mouseY;
                        cropData.width = nwNewWidth;
                        cropData.height = aspectRatio ? cropData.width / aspectRatio : nwNewHeight;
                    }
                    break;
            }
            
            // Keep within canvas bounds
            if (cropData.x < 0) {
                cropData.width += cropData.x;
                cropData.x = 0;
            }
            if (cropData.y < 0) {
                cropData.height += cropData.y;
                cropData.y = 0;
            }
            if (cropData.x + cropData.width > previewCanvas.width) {
                cropData.width = previewCanvas.width - cropData.x;
                if (aspectRatio) cropData.height = cropData.width / aspectRatio;
            }
            if (cropData.y + cropData.height > previewCanvas.height) {
                cropData.height = previewCanvas.height - cropData.y;
                if (aspectRatio) cropData.width = cropData.height * aspectRatio;
            }
        }

        function stopDrag() {
            isDragging = false;
            isResizing = false;
            currentHandle = null;
        }

        function cropImage() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const scaleX = currentImage.width / previewCanvas.width;
            const scaleY = currentImage.height / previewCanvas.height;
            
            canvas.width = cropData.width * scaleX;
            canvas.height = cropData.height * scaleY;
            
            ctx.drawImage(
                currentImage,
                cropData.x * scaleX,
                cropData.y * scaleY,
                cropData.width * scaleX,
                cropData.height * scaleY,
                0,
                0,
                canvas.width,
                canvas.height
            );
            
            resultPreview.src = canvas.toDataURL('image/jpeg', 0.9);
            resultContainer.style.display = 'block';
            previewContainer.style.display = 'none';
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'profile.jpg';
            link.href = resultPreview.src;
            link.click();
        }

        function startOver() {
            resultContainer.style.display = 'none';
            previewContainer.style.display = 'block';
            fileInput.value = '';
        }

        // Window resize handler
        window.addEventListener('resize', function() {
            if (currentImage) {
                updateCropOverlay();
            }
        });
    </script>
</body>
</html>
